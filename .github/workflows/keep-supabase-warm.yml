# Keep the Supabase free-tier project warm by pinging it daily.
#
# Free Supabase projects auto-pause after ~7 days without any API activity,
# which surfaces in the app as a "Failed to fetch" on the magic-link login
# screen and looks like a bug to anyone who isn't us. Pinging both /auth and
# /rest covers the auth-only and database-query pause heuristics.
#
# If you see this workflow failing, your Supabase project is unreachable.
# Fix THAT first (restore in dashboard, or provision a new project). This
# workflow only succeeds when BOTH the secret is set AND the project responds.
#
# Otherwise it now exits cleanly with a warning log so the GitHub UI stops
# showing red Xs / sending failure emails for an issue you already know about.
#
# Required GitHub repo secret:
#   SUPABASE_ANON_KEY  — the public anon key from the Supabase dashboard
#                        (already in the published JS bundle, so it's not
#                        a sensitive value — just stored as a secret for
#                        easy rotation).
#
# To set it once:
#   gh secret set SUPABASE_ANON_KEY -b "<paste-anon-key-here>"

name: Keep Supabase warm

on:
  schedule:
    # Daily at 14:00 UTC (~9am ET). Picks an off-cron-rush minute (37) to
    # avoid GitHub's hot scheduler windows that can delay runs by 30+ min.
    - cron: '37 14 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret is configured
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning ::SUPABASE_ANON_KEY secret not set — skipping warm-up entirely."
            echo "Set it once with: gh secret set SUPABASE_ANON_KEY -b '<anon-key>'"
            echo "ABORT_PING=1" >> "$GITHUB_ENV"
          fi

      - name: Ping Supabase auth + REST
        if: env.ABORT_PING != '1'
        env:
          SUPABASE_URL: https://erloankcalivhfqdweyv.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          echo "→ Pinging /auth/v1/health (no auth)"
          # `|| echo …` swallows DNS / network failures so the workflow run
          # itself stays green. The reason: when the Supabase project is fully
          # deprovisioned (NXDOMAIN), there is nothing this workflow can do —
          # it would just spam failure emails about a known-broken thing.
          auth_status=$(curl -sS -o /tmp/auth.out -w "%{http_code}" \
            --max-time 15 \
            "$SUPABASE_URL/auth/v1/health" \
            || echo "000")
          echo "  status: $auth_status"
          [ -s /tmp/auth.out ] && head -c 200 /tmp/auth.out; echo

          if [ "$auth_status" = "000" ]; then
            echo "::warning ::supabase unreachable (DNS / network failure). Skipping rest of warm-up."
            echo "If this persists, your Supabase project may be paused or deprovisioned."
            echo "Investigate at https://supabase.com/dashboard before relying on cloud sync."
            exit 0
          fi

          echo "→ Pinging /rest/v1/ (uses anon key — counts as DB activity)"
          rest_status=$(curl -sS -o /tmp/rest.out -w "%{http_code}" \
            --max-time 15 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/" \
            || echo "000")
          echo "  status: $rest_status"
          [ -s /tmp/rest.out ] && head -c 200 /tmp/rest.out; echo

          if [ "$rest_status" = "000" ]; then
            echo "::warning ::REST endpoint unreachable but auth health responded — partial outage?"
            exit 0
          fi

          # 200 = healthy, 401 = also fine (RLS rejected anon read but the
          # request still hit the database). Anything else is logged but no
          # longer hard-fails the workflow — Kyra has bigger problems if it's
          # in this state, and a daily red-X email won't help.
          if [ "$auth_status" != "200" ] || [ "$rest_status" != "200" -a "$rest_status" != "401" ]; then
            echo "::warning ::Project responded but with unexpected status (auth=$auth_status rest=$rest_status). May be paused — investigate in the Supabase dashboard."
            exit 0
          fi
          echo "✓ Supabase project is alive."
